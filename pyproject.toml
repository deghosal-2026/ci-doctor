[project]
name = "ci-doctor"
version = "0.1.0"
description = "Self-healing CI/CD pipeline — classifies, auto-resolves, and escalates CI failures"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "click>=8.4.2",
    "pydantic>=2.0",
]

[project.scripts]
ci-doctor = "cli.report:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
