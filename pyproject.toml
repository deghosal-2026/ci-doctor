[project]
name = "ci-doctor"
version = "0.1.0"
description = "Self-healing CI/CD pipeline — classifies, auto-resolves, and escalates CI failures"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "click>=8.5.0",
    "pydantic>=2.14.1",
]

[project.scripts]
ci-doctor = "cli.report:cli"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
